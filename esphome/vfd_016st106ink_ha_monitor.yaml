substitutions:
  devicename: retro-vfd-monitor
  friendly_name: Retro VFD Monitor

  # ESP32-C3 SuperMini exposed pins, verified by the smoke test.
  vfd_pin_rst: "0"
  vfd_pin_cs: "1"
  vfd_pin_cp: "4"
  vfd_pin_da: "5"
  vfd_pin_en: "6"

  # Computer telemetry entities from the current Home Assistant integration.
  ha_cpu_temp: sensor.desktop_current_cpu_temperature
  ha_cpu_load: sensor.desktop_current_cpu_load
  ha_cpu_power: sensor.desktop_current_cpu_power
  ha_gpu_temp: sensor.desktop_current_gpu_temperature
  ha_gpu_load: sensor.desktop_current_gpu_load
  ha_gpu_power: sensor.desktop_current_gpu_power
  ha_memory_percent: sensor.desktop_current_memory_usage
  ha_fan_rpm_max: sensor.desktop_current_fan_speed_max
  ha_system_power: sensor.desktop_current_system_power_estimated
  ha_source_ok: binary_sensor.desktop_current_source_ok

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  includes:
    - includes/vfd_016st106ink/vfd_016st106ink.h
  platformio_options:
    build_flags:
      - -D VFD_PIN_RST=${vfd_pin_rst}
      - -D VFD_PIN_CS=${vfd_pin_cs}
      - -D VFD_PIN_CP=${vfd_pin_cp}
      - -D VFD_PIN_DA=${vfd_pin_da}
      - -D VFD_PIN_EN=${vfd_pin_en}
  on_boot:
    priority: -100
    then:
      - script.execute: boot_seq

globals:
  - id: last_data_time
    type: uint32_t
    initial_value: "0"
  - id: vfd_power_state
    type: bool
    initial_value: "true"
  - id: is_booting
    type: bool
    initial_value: "true"
  - id: current_page
    type: uint8_t
    initial_value: "0"
  - id: page_switch_time
    type: uint32_t
    initial_value: "0"
  - id: ctrl_animation
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: ctrl_sleep_timeout_s
    type: uint32_t
    restore_value: yes
    initial_value: "180"
  - id: ctrl_page_interval_s
    type: uint32_t
    restore_value: yes
    initial_value: "10"
  - id: ctrl_brightness_pct
    type: float
    restore_value: yes
    initial_value: "88.0"
  - id: data_ready_state
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: boot_seq
    then:
      - if:
          condition:
            lambda: 'return !id(ctrl_animation);'
          then:
            - lambda: |-
                id(is_booting) = false;
                id(last_data_time) = millis();
                id(page_switch_time) = millis();
                const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
                const bool linked = id(source_ok).has_state() && id(source_ok).state;
                const bool has_core = !std::isnan(id(cpu_temp).state) && !std::isnan(id(gpu_temp).state);
                id(data_ready_state) = linked && has_core;
                vfd_016st106ink::begin(target_brightness);
            - script.stop: boot_seq
      - lambda: |-
          vfd_016st106ink::begin(0x00); // Start dark
          // Fill screen with blocks
          uint8_t full_blocks[16];
          memset(full_blocks, 0x7F, 16);
          vfd_016st106ink::print_line_bytes(1, full_blocks, 16);
          vfd_016st106ink::print_line_bytes(2, full_blocks, 16);
      
      # Phase 1: Glow Up
      - repeat:
          count: 15
          then:
            - lambda: |-
                const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
                const uint8_t step_brightness = (uint8_t) roundf((target_brightness * (iteration + 1)) / 15.0f);
                vfd_016st106ink::set_brightness(step_brightness);
            - delay: 80ms
      - delay: 1000ms
      
      # Phase 2: Icon Diagnostics
      - lambda: |-
          vfd_016st106ink::clear();
          vfd_016st106ink::print_line(1, "DIAGNOSTIC...");
      - repeat:
          count: 8
          then:
            - lambda: |-
                uint8_t grid = 9 + iteration;
                vfd_016st106ink::set_grid_icon(grid, true, true, true, true);
            - delay: 200ms
      
      # Phase 3: BIOS Hex Scroll
      - lambda: vfd_016st106ink::print_line(1, "LOADING NOX-OS");
      - repeat:
          count: 25
          then:
            - lambda: |-
                char hex_buf[17];
                sprintf(hex_buf, "0x%02X 0x%02X 0x%02X 0x%02X", 
                        rand() % 256, rand() % 256, rand() % 256, rand() % 256);
                vfd_016st106ink::print_line(2, hex_buf);
            - delay: 160ms
      
      # Phase 4: Finalize
      - lambda: |-
          vfd_016st106ink::clear();
          vfd_016st106ink::print_line(1, "SYSTEM READY");
      - delay: 1600ms
      - lambda: |-
          id(is_booting) = false;
          id(last_data_time) = millis();
          id(page_switch_time) = millis();
          const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
          const bool linked = id(source_ok).has_state() && id(source_ok).state;
          const bool has_core = !std::isnan(id(cpu_temp).state) && !std::isnan(id(gpu_temp).state);
          id(data_ready_state) = linked && has_core;
          vfd_016st106ink::set_brightness(target_brightness);
          vfd_016st106ink::load_retro_glyphs();

  - id: page_transition
    then:
      - if:
          condition:
            lambda: 'return !id(ctrl_animation);'
          then:
            - lambda: |-
                id(current_page) = (id(current_page) + 1) % 2;
                id(page_switch_time) = millis();
            - script.stop: page_transition
      # Phase 1: Fade Out (亮度衰减，模拟断电)
      - repeat:
          count: 5
          then:
            - lambda: |-
                const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
                const uint8_t floor_brightness = 5;
                const uint8_t next_brightness = (uint8_t) roundf(target_brightness - ((target_brightness - floor_brightness) * (iteration + 1) / 5.0f));
                vfd_016st106ink::set_brightness(next_brightness);
            - delay: 50ms

      # Phase 2: Matrix Decode + Fade In (解码 + 亮度恢复)
      - repeat:
          count: 11
          then:
            - lambda: |-
                const char hex[] = "0123456789ABCDEF";
                auto val = [](float v) -> float { return std::isnan(v) ? 0.0f : v; };

                int cpu_t = std::min(99, std::max(0, (int)roundf(val(id(cpu_temp).state))));
                int gpu_t = std::min(99, std::max(0, (int)roundf(val(id(gpu_temp).state))));
                int cpu_l = std::min(99, std::max(0, (int)roundf(val(id(cpu_load).state))));
                int mem_p = std::min(99, std::max(0, (int)roundf(val(id(memory_percent).state))));
                int fan_r = std::min(9999, std::max(0, (int)roundf(val(id(fan_rpm).state))));
                int pwr   = std::min(999, std::max(0, (int)roundf(val(id(system_power).state))));

                uint8_t sep = 7;
                uint8_t char_ab = 0x5C;

                uint8_t next = (id(current_page) + 1) % 2;
                uint8_t tgt_l1[8], tgt_l2[11];
                if (next == 0) {
                  tgt_l1[0]=0; tgt_l1[1]=1; tgt_l1[2]=2; tgt_l1[3]=sep;
                  tgt_l1[4]=3; tgt_l1[5]=1; tgt_l1[6]=2; tgt_l1[7]=sep;
                  tgt_l2[0]='0'+cpu_t/10; tgt_l2[1]='0'+cpu_t%10; tgt_l2[2]=5;
                  tgt_l2[3]=7;
                  tgt_l2[4]='0'+gpu_t/10; tgt_l2[5]='0'+gpu_t%10; tgt_l2[6]=5;
                  tgt_l2[7]=7;
                  if (cpu_l<10) { tgt_l2[8]='0'+cpu_l; tgt_l2[9]='%'; tgt_l2[10]=' '; }
                  else { tgt_l2[8]='0'+cpu_l/10; tgt_l2[9]='0'+cpu_l%10; tgt_l2[10]='%'; }
                } else {
                  tgt_l1[0]='M'; tgt_l1[1]='E'; tgt_l1[2]='M'; tgt_l1[3]=sep;
                  tgt_l1[4]='F'; tgt_l1[5]='A'; tgt_l1[6]='N'; tgt_l1[7]=sep;
                  tgt_l2[0]='0'+mem_p/10; tgt_l2[1]='0'+mem_p%10; tgt_l2[2]='%';
                  tgt_l2[3]=7;
                  if (fan_r<1000) { tgt_l2[4]=' '; tgt_l2[5]='0'+fan_r/100; } else { tgt_l2[4]='0'+fan_r/1000; tgt_l2[5]='0'+(fan_r/100)%10; }
                  tgt_l2[6]='0'+(fan_r/10)%10; tgt_l2[7]='0'+fan_r%10;
                  tgt_l2[8]='r'; tgt_l2[9]=' '; tgt_l2[10]=' ';
                }

                int f = iteration; // 0-10

                // 构建 Line 1：已锁定 + 随机噪声
                uint8_t line1[16];
                memset(line1, ' ', 16);
                for (int i = 0; i < 8; i++) {
                  // 分隔符位(3,7)始终直接锁定
                  if (i == 3 || i == 7) { line1[i] = sep; continue; }
                  // 前 f 个非分隔符位已解码锁定
                  int lock_threshold = (f * 8) / 11; // 按比例锁定 line1
                  if (i <= lock_threshold) {
                    line1[i] = tgt_l1[i];
                  } else {
                    line1[i] = hex[rand() % 16];
                  }
                }
                line1[14] = char_ab;
                line1[15] = char_ab;

                // 构建 Line 2：已锁定 + 随机噪声
                uint8_t line2[16];
                memset(line2, ' ', 16);
                for (int i = 0; i < 11; i++) {
                  // 分隔符位(3,7)始终直接锁定
                  if (i == 3 || i == 7) { line2[i] = 7; continue; }
                  if (i <= f) {
                    line2[i] = tgt_l2[i]; // 已解码
                  } else {
                    line2[i] = hex[rand() % 16]; // 随机噪声
                  }
                }
                // 功率段不变
                line2[11]=6; line2[12]='0'+pwr/100;
                line2[13]='0'+(pwr/10)%10; line2[14]='0'+pwr%10;
                line2[15]='w';

                vfd_016st106ink::print_line_bytes(1, line1, 16);
                vfd_016st106ink::print_line_bytes(2, line2, 16);

                // 亮度同步恢复到 HA 当前设定值，而不是硬编码回 100%。
                const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
                const uint8_t floor_brightness = 5;
                const uint8_t next_brightness = (uint8_t) roundf(floor_brightness + ((target_brightness - floor_brightness) * (iteration + 1) / 11.0f));
                vfd_016st106ink::set_brightness(next_brightness);
            - delay: 55ms

      # Phase 3: 最终锁定
      - lambda: |-
          const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
          vfd_016st106ink::set_brightness(target_brightness);
          id(current_page) = (id(current_page) + 1) % 2;
          id(page_switch_time) = millis();

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: 44:DF:65:DA:7C:6A
      channel: 4
  power_save_mode: none
  output_power: 20.5dB
  fast_connect: true
  ap:
    ssid: "Retro VFD Fallback"
    password: "retro-vfd"

captive_portal:


sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "WiFi Signal"
    update_interval: 10s
    entity_category: diagnostic
  - platform: homeassistant
    id: cpu_temp
    entity_id: ${ha_cpu_temp}
    on_value:
      then:
        - lambda: |-
            id(last_data_time) = millis();
            if (!id(vfd_power_state)) {
              id(vfd_power_state) = true;
              const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
              vfd_016st106ink::begin(target_brightness);
            }
  - platform: homeassistant
    id: cpu_load
    entity_id: ${ha_cpu_load}
    on_value:
      then:
        - lambda: id(last_data_time) = millis();
  - platform: homeassistant
    id: cpu_power
    entity_id: ${ha_cpu_power}
  - platform: homeassistant
    id: gpu_temp
    entity_id: ${ha_gpu_temp}
  - platform: homeassistant
    id: gpu_load
    entity_id: ${ha_gpu_load}
  - platform: homeassistant
    id: memory_percent
    entity_id: ${ha_memory_percent}
  - platform: homeassistant
    id: fan_rpm
    entity_id: ${ha_fan_rpm_max}
  - platform: homeassistant
    id: system_power
    entity_id: ${ha_system_power}

binary_sensor:
  - platform: homeassistant
    id: source_ok
    entity_id: ${ha_source_ok}

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(is_booting)) return;
          
          // 自动息屏 (3 分钟无数据)
          const uint32_t sleep_timeout_ms = id(ctrl_sleep_timeout_s) * 1000UL;
          if (id(vfd_power_state) && millis() > sleep_timeout_ms && (millis() - id(last_data_time) > sleep_timeout_ms)) {
            id(vfd_power_state) = false;
            vfd_016st106ink::set_power(false);
          }
          if (!id(vfd_power_state)) return;

          // 过渡动画播放中，跳过渲染
          if (id(page_transition).is_running()) return;

          static bool blink = false;
          blink = !blink;

          auto has_value = [](float v) -> bool { return !std::isnan(v); };
          auto val = [&](float v) -> float { return std::isnan(v) ? 0.0f : v; };

          const bool linked = id(source_ok).has_state() && id(source_ok).state;
          const bool has_core = has_value(id(cpu_temp).state) && has_value(id(gpu_temp).state);

          // ADRAM 图标
          vfd_016st106ink::set_grid_icon(9, true, true);
          vfd_016st106ink::set_grid_icon(10, true, true);
          // 11G, 12G: AD2=SP A (第二屏亮), AD1=SP B (第一屏亮)
          bool spa = (id(current_page) == 1);
          bool spb = (id(current_page) == 0);
          vfd_016st106ink::set_grid_icon(11, spa, spb);
          vfd_016st106ink::set_grid_icon(12, spa, spb);
          vfd_016st106ink::set_grid_icon(13, true, true);
          vfd_016st106ink::set_grid_icon(14, true, true);
          vfd_016st106ink::set_grid_icon(15, false, false, blink, blink);
          vfd_016st106ink::set_grid_icon(16, false, false, blink, blink);

          if (!linked || !has_core) {
            id(data_ready_state) = false;
            vfd_016st106ink::print_line(1, linked ? "DATA WAIT" : "LINK WARN");
            vfd_016st106ink::print_line(2, linked ? "WAIT TELEMETRY" : "HA LINK STANDBY");
            return;
          }

          if (!id(data_ready_state)) {
            id(data_ready_state) = true;
            id(is_booting) = true;
            id(page_switch_time) = millis();
            id(boot_seq).execute();
            return;
          }

          // 10 秒轮播检查
          if (millis() - id(page_switch_time) > (id(ctrl_page_interval_s) * 1000UL)) {
            id(page_transition).execute();
            return;
          }

          // 计算传感器数值
          const int cpu_temp_i = std::min(99, std::max(0, (int)roundf(val(id(cpu_temp).state))));
          const int gpu_temp_i = std::min(99, std::max(0, (int)roundf(val(id(gpu_temp).state))));
          const int cpu_load_i = std::min(99, std::max(0, (int)roundf(val(id(cpu_load).state))));
          const int mem_i      = std::min(99, std::max(0, (int)roundf(val(id(memory_percent).state))));
          const int fan_rpm_i  = std::min(9999, std::max(0, (int)roundf(val(id(fan_rpm).state))));
          const int power_i    = std::min(999, std::max(0, (int)roundf(val(id(system_power).state))));

          uint8_t sep = blink ? 4 : 7;
          uint8_t char_ab = blink ? 0x5F : 0x5C;

          // ======= 构建 Line 1 =======
          uint8_t line1[16];
          memset(line1, ' ', 16);
          if (id(current_page) == 0) {
            line1[0]=0; line1[1]=1; line1[2]=2; line1[3]=sep;
            line1[4]=3; line1[5]=1; line1[6]=2; line1[7]=sep;
          } else {
            line1[0]='M'; line1[1]='E'; line1[2]='M'; line1[3]=sep;
            line1[4]='F'; line1[5]='A'; line1[6]='N'; line1[7]=sep;
          }
          line1[14] = char_ab;
          line1[15] = char_ab;

          // ======= 构建 Line 2 =======
          uint8_t line2[16];
          memset(line2, ' ', 16);

          if (id(current_page) == 0) {
            // Page 0: CPU温度 | GPU温度 | 负载 | 功率
            line2[0]='0'+cpu_temp_i/10; line2[1]='0'+cpu_temp_i%10; line2[2]=5;
            line2[3]=7;
            line2[4]='0'+gpu_temp_i/10; line2[5]='0'+gpu_temp_i%10; line2[6]=5;
            line2[7]=7;
            if (cpu_load_i < 10) {
              line2[8]='0'+cpu_load_i; line2[9]='%'; line2[10]=' ';
            } else {
              line2[8]='0'+cpu_load_i/10; line2[9]='0'+cpu_load_i%10; line2[10]='%';
            }
          } else {
            // Page 1: 内存% | 风扇转速RPM | 功率
            line2[0]='0'+mem_i/10; line2[1]='0'+mem_i%10; line2[2]='%';
            line2[3]=7;
            if (fan_rpm_i<1000) { line2[4]=' '; line2[5]='0'+fan_rpm_i/100; } else { line2[4]='0'+fan_rpm_i/1000; line2[5]='0'+(fan_rpm_i/100)%10; }
            line2[6]='0'+(fan_rpm_i/10)%10; line2[7]='0'+fan_rpm_i%10;
            line2[8]='r'; line2[9]=' '; line2[10]=' ';
          }

          // 功率段（两页共享）
          line2[11]=6; line2[12]='0'+power_i/100;
          line2[13]='0'+(power_i/10)%10; line2[14]='0'+power_i%10;
          line2[15]='w';

          vfd_016st106ink::print_line_bytes(1, line1, 16);
          vfd_016st106ink::print_line_bytes(2, line2, 16);

number:
  - platform: template
    id: vfd_brightness_control
    name: "Brightness"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 88
    set_action:
      - lambda: |-
          id(ctrl_brightness_pct) = x;
          if (id(vfd_power_state)) {
            vfd_016st106ink::set_brightness((uint8_t) roundf((x / 100.0f) * 255.0f));
          }

  - platform: template
    id: vfd_sleep_timeout_control
    name: "Sleep Timeout"
    optimistic: true
    restore_value: true
    min_value: 30
    max_value: 600
    step: 30
    unit_of_measurement: s
    initial_value: 180
    set_action:
      - lambda: |-
          id(ctrl_sleep_timeout_s) = static_cast<uint32_t>(x);

  - platform: template
    id: vfd_rotate_interval_control
    name: "Auto Rotate Interval"
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 60
    step: 1
    unit_of_measurement: s
    initial_value: 10
    set_action:
      - lambda: |-
          id(ctrl_page_interval_s) = static_cast<uint32_t>(x);

switch:
  - platform: template
    id: vfd_display_power_control
    name: "Display Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(vfd_power_state);
    turn_on_action:
      - lambda: |-
          id(vfd_power_state) = true;
          id(last_data_time) = millis();
          const uint8_t target_brightness = (uint8_t) roundf(std::max(5.0f, (std::min(100.0f, std::max(0.0f, id(ctrl_brightness_pct))) / 100.0f) * 255.0f));
          vfd_016st106ink::begin(target_brightness);
          id(is_booting) = false;
    turn_off_action:
      - lambda: |-
          id(vfd_power_state) = false;
          vfd_016st106ink::set_power(false);

  - platform: template
    id: vfd_animation_control
    name: "Animation"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(ctrl_animation);
    turn_on_action:
      - lambda: |-
          id(ctrl_animation) = true;
    turn_off_action:
      - lambda: |-
          id(ctrl_animation) = false;

button:
  - platform: restart
    name: "Restart"
