            return;
          }
          if (id(provision_overlay_mode) == 2) {
            draw_overlay("CONNECTED", "ENTERING UI");
            finalize_page(1);
            return;
          }

          const int W = it.get_width();
          const bool blink_on = (millis() / 500) % 2 == 0;
          it.fill(COLOR_OFF);
          it.printf(2, 0, id(font_header), COLOR_ON, "%s", "${host_label}");
          it.printf(W / 2, 0, id(font_header), COLOR_ON, TextAlign::TOP_CENTER, "ROUTER PANEL");
          it.printf(215, 0, id(font_header), COLOR_ON, id(rtr_source_ok) ? "READY" : "ALERT");
          if (blink_on) {
            it.filled_rectangle(250, 1, 4, 4, COLOR_ON);
          } else {
            it.rectangle(250, 1, 4, 4, COLOR_ON);
          }
          it.line(0, 10, W, 10, COLOR_ON);
          it.line(85, 11, 85, 63, COLOR_ON);
          it.line(171, 11, 171, 63, COLOR_ON);

          if (!id(rtr_source_ok)) {
            it.printf(84, 20, id(font_section), COLOR_ON, "ROUTER");
            it.printf(98, 34, id(font_section), COLOR_ON, "OFF");
            finalize_page(1);
            return;
          }

          const int left_x = 0;
          const int mid_x = 86;
          const int right_x = 172;
          const int left_right = 80;
          const int mid_right = 166;
          const int right_right = 252;

          auto draw_big_number = [&](int x, int y, float value) -> int {
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", value);
            int cursor = x;
            for (const char *p = buf; *p; ++p) {
              char glyph[2] = {*p, '\0'};
              it.printf(cursor, y, id(font_big_num), COLOR_ON, "%s", glyph);
              cursor += (*p == '.') ? 8 : 16;
            }
            return cursor - x;
          };

          auto draw_net_big_text = [&](int x, int y, const char *buf) -> int {
            int cursor = x;
            for (const char *p = buf; *p; ++p) {
              char glyph[2] = {*p, '\0'};
              it.printf(cursor, y, id(font_net_big), COLOR_ON, "%s", glyph);
              cursor += (*p == '.') ? 6 : 11;
            }
            return cursor - x;
          };

          auto draw_progress_blocks = [&](int right_edge, int y, float percent) {
            const int bw = 5, bh = 6, gap = 1, total = 12;
            float cl = percent < 0.0f ? 0.0f : (percent > 100.0f ? 100.0f : percent);
            int filled = static_cast<int>(roundf((cl / 100.0f) * total));
            int tw = total * bw + (total - 1) * gap;
            int x = right_edge - tw;
            Color bright_color(0, 0, 0, 178);  // 70% brightness
            Color dim_color(0, 0, 0, 77);      // 30% brightness
            for (int i = 0; i < total; i++) {
              if (i < filled) {
                it.filled_rectangle(x, y, bw, bh, bright_color);
              } else {
                it.filled_rectangle(x, y, bw, bh, dim_color);
              }
              x += bw + gap;
            }
          };

          auto format_rate = [](float bps, char *vbuf, size_t vlen, char *ubuf, size_t ulen) {
            if (bps >= 1000000.0f) {
              float m = bps / 1000000.0f;
              snprintf(vbuf, vlen, m >= 10.0f ? "%.0f" : "%.1f", m);
              snprintf(ubuf, ulen, "M");
            } else {
              float k = bps / 1000.0f;
              snprintf(vbuf, vlen, k >= 10.0f ? "%.0f" : "%.1f", k);
              snprintf(ubuf, ulen, "K");
            }
          };

          const float net_down = safe_value(id(rtr_net_down));
          const float net_up = safe_value(id(rtr_net_up));

          char dv[8], du[4], uv[8], uu[4];
          format_rate(net_down, dv, sizeof(dv), du, sizeof(du));
          format_rate(net_up, uv, sizeof(uv), uu, sizeof(uu));

          it.printf(left_x + 4, 16, id(font_section), COLOR_ON, "NET");
          it.printf(left_x + 4, 27, id(font_stat), COLOR_ON, "DN");
          const int ndw = draw_net_big_text(left_x + 20, 20, dv);
          it.printf(left_x + 22 + ndw, 23, id(font_stat), COLOR_ON, "%s", du);
          it.printf(left_x + 4, 47, id(font_stat), COLOR_ON, "UP");
          const int nuw = draw_net_big_text(left_x + 20, 40, uv);
          it.printf(left_x + 22 + nuw, 43, id(font_stat), COLOR_ON, "%s", uu);

          const float rcpu_t = safe_value(id(rtr_cpu_temp));
          const float rcpu_l = safe_value(id(rtr_cpu_load));
          const float wan_h = safe_value(id(rtr_wan_upt)) / 3600.0f;

          it.printf(mid_x + 4, 16, id(font_section), COLOR_ON, "CPU");
