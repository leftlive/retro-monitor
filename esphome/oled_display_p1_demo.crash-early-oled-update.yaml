substitutions:
  devicename: retro-monitor-display
  friendly_name: Retro Monitor Display
  host_label: NOX V0.02
  page_rotate_s: "10"
  ha_mac_payload: sensor.desktop_current_display_payload
  ha_router_payload: sensor.istoreos_display_payload

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  includes:
    - my_includes.h
  libraries:
    - ArduinoJson@6.21.3
  on_boot:
    priority: -10
    then:
      - lambda: |-
          retro_diag::ensure_wifi_event_handler_registered();
      - lambda: |-
          id(oled).set_brightness(id(ctrl_brightness_raw) / 255.0f);
      - display.page.show: router_page
      - component.update: oled

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: WARN
  baud_rate: 115200

api:
  homeassistant_states: true
  batch_delay: 100ms
  reboot_timeout: 2min

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 20.5dB
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 5min
  on_connect:
    then:
      - lambda: |-
          if (id(provision_overlay_mode) == 1) {
            id(provision_overlay_mode) = 2;
            id(provision_success_until_ms) = millis() + 3000UL;
            id(oled).update();
          }
  ap:
    ssid: "RetroMonitor Setup"
    password: !secret fallback_ap_password
    ap_timeout: 10min

captive_portal:

# Current module wiring contract: SSD1322 16-pin board in 4SPI mode.
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

globals:
  # Timestamps
  - id: last_ha_state_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_computer_state_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: computer_payload_seen
    type: bool
    restore_value: no
    initial_value: "false"
  - id: display_frame_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: ctrl_mode_code
    type: int
    restore_value: no
    initial_value: "0"  # 0 auto, 1 router, 2 computer, 3 trend
  - id: ctrl_page_interval_s
    type: uint32_t
    restore_value: no
    initial_value: "10"
  - id: ctrl_brightness_raw
    type: float
    restore_value: no
    initial_value: "180.0"
  - id: ctrl_auto_rotate
    type: bool
    restore_value: no
    initial_value: "true"
  - id: ctrl_display_power
    type: bool
    restore_value: no
    initial_value: "true"
  - id: last_page_rotate_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: rotate_page_index
    type: int
    restore_value: no
    initial_value: "0"
  - id: current_page_code
    type: int
    restore_value: no
    initial_value: "1"
  - id: pending_page_code
    type: int
    restore_value: no
    initial_value: "0"
  - id: page_switch_request_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_page_switch_ms
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: last_render_time_ms
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: max_render_time_ms
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: provision_overlay_mode
    type: int
    restore_value: no
    initial_value: "0"  # 0 normal, 1 setup, 2 connected
  - id: provision_success_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
    
  # MAC Globals
  - id: mac_cpu_temp
    type: float
    initial_value: "0.0"
  - id: mac_cpu_load
    type: float
    initial_value: "0.0"
  - id: mac_cpu_power
    type: float
    initial_value: "0.0"
  - id: mac_gpu_temp
    type: float
    initial_value: "0.0"
  - id: mac_gpu_load
    type: float
    initial_value: "0.0"
  - id: mac_sys_power
    type: float
    initial_value: "0.0"
  - id: mac_mem_used
    type: float
    initial_value: "0.0"
  - id: mac_mem_pct
    type: float
    initial_value: "0.0"
  - id: mac_disk_temp
    type: float
    initial_value: "0.0"
  - id: mac_source_ok
    type: bool
    initial_value: "false"

  # ROUTER Globals
  - id: rtr_net_down
    type: float
    initial_value: "0.0"
  - id: rtr_net_up
    type: float
    initial_value: "0.0"
  - id: rtr_cpu_temp
    type: float
    initial_value: "0.0"
  - id: rtr_cpu_load
    type: float
    initial_value: "0.0"
  - id: rtr_wan_upt
    type: float
    initial_value: "0.0"
  - id: rtr_mem_used
    type: float
    initial_value: "0.0"
  - id: rtr_mem_tot
    type: float
    initial_value: "0.0"
  - id: rtr_mem_pct
    type: float
    initial_value: "0.0"
  - id: rtr_source_ok
    type: bool
    initial_value: "false"

  # P2 Trend animation globals
  - id: trend_anim_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: trend_anim_duration_ms
    type: uint32_t
    restore_value: no
    initial_value: "900"
  - id: trend_sys_prev
    type: std::vector<float>
    restore_value: no
    initial_value: "std::vector<float>()"
  - id: trend_sys_target
    type: std::vector<float>
    restore_value: no
    initial_value: "std::vector<float>()"
  - id: trend_cpu_prev
    type: std::vector<float>
    restore_value: no
    initial_value: "std::vector<float>()"
  - id: trend_cpu_target
    type: std::vector<float>
    restore_value: no
    initial_value: "std::vector<float>()"
  - id: trend_gpu_prev
    type: std::vector<float>
    restore_value: no
    initial_value: "std::vector<float>()"
  - id: trend_gpu_target
    type: std::vector<float>
    restore_value: no
    initial_value: "std::vector<float>()"

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip_address
      name: "Retro Monitor WiFi IP"
      entity_category: diagnostic
    ssid:
      id: wifi_ssid_name
      name: "Retro Monitor WiFi SSID"
      entity_category: diagnostic
    bssid:
      id: wifi_bssid_name
      name: "Retro Monitor WiFi BSSID"
      entity_category: diagnostic
    mac_address:
      id: wifi_mac_address
      name: "Retro Monitor WiFi MAC"
      entity_category: diagnostic

  - platform: template
    id: esp_runtime_state
    name: "Retro Monitor Runtime State"
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (id(provision_overlay_mode) == 1) return {"setup_mode"};
      if (id(provision_overlay_mode) == 2) return {"connected_overlay"};
      const uint32_t now = millis();
      const bool computer_active =
        id(computer_payload_seen) &&
        ((now - id(last_computer_state_ms)) <= 10000UL);
      if (!computer_active) return {"router_only"};
      if (!id(ctrl_auto_rotate)) return {"manual_mode"};
      switch (id(ctrl_mode_code)) {
        case 1: return {"router_panel"};
        case 2: return {"computer_panel"};
        case 3: return {"trend_panel"};
        default: return {"auto_rotate"};
      }

  - platform: template
    id: wifi_last_event
    name: "Retro Monitor WiFi Last Event"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return {retro_diag::last_wifi_event};

  - platform: homeassistant
    id: mac_payload
    entity_id: ${ha_mac_payload}
    on_value:
      then:
        - lambda: |-
            DynamicJsonDocument doc(512);
            DeserializationError err = deserializeJson(doc, x.c_str());
            if (!err) {
              const char *tp = doc["tp"] | "";
              id(mac_cpu_temp) = doc["ct"] | 0.0f;
              id(mac_cpu_load) = doc["cl"] | 0.0f;
              id(mac_cpu_power) = doc["cp"] | 0.0f;
              id(mac_gpu_temp) = doc["gt"] | 0.0f;
              id(mac_gpu_load) = doc["gl"] | 0.0f;
              id(mac_sys_power) = doc["sp"] | 0.0f;
              id(mac_mem_used) = doc["mu"] | 0.0f;
              id(mac_mem_pct) = doc["mp"] | 0.0f;
              id(mac_disk_temp) = doc["dt"] | 0.0f;
              int ok = doc["ok"] | 0;
              id(mac_source_ok) = (ok == 1);
              id(last_ha_state_ms) = millis();
              if (strcmp(tp, "computer") == 0) {
                id(computer_payload_seen) = true;
                id(last_computer_state_ms) = millis();
              }
            } else {
              ESP_LOGW("json", "MAC JSON parse error");
            }

  - platform: homeassistant
    id: router_payload
    entity_id: ${ha_router_payload}
    on_value:
      then:
        - lambda: |-
            DynamicJsonDocument doc(512);
            DeserializationError err = deserializeJson(doc, x.c_str());
            if (!err) {
              id(rtr_net_down) = doc["nd"] | 0.0f;
              id(rtr_net_up) = doc["nu"] | 0.0f;
              id(rtr_cpu_temp) = doc["ct"] | 0.0f;
              id(rtr_cpu_load) = doc["cl"] | 0.0f;
              id(rtr_wan_upt) = doc["wu"] | 0.0f;
              id(rtr_mem_used) = doc["mu"] | 0.0f;
              id(rtr_mem_tot) = doc["mt"] | 0.0f;
              id(rtr_mem_pct) = doc["mp"] | 0.0f;
              int ok = doc["ok"] | 0;
              id(rtr_source_ok) = (ok == 1);
              id(last_ha_state_ms) = millis();
            } else {
              ESP_LOGW("json", "Router JSON parse error");
            }

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "Retro Monitor WiFi RSSI"
    update_interval: 10s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_rssi
    name: "Retro Monitor WiFi Signal"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: return min(max(2.0f * (x + 100.0f), 0.0f), 100.0f);

  - platform: uptime
    id: esp_uptime
    name: "Retro Monitor Uptime"
    update_interval: 30s
    entity_category: diagnostic

  - platform: template
    id: esp_free_heap
    name: "Retro Monitor Free Heap"
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 10s
    entity_category: diagnostic
    lambda: |-
      return (float) ESP.getFreeHeap();

  - platform: template
    id: ha_state_age
    name: "Retro Monitor HA State Age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    lambda: |-
      if (id(last_ha_state_ms) == 0) return 0.0f;
      return (millis() - id(last_ha_state_ms)) / 1000.0f;

  - platform: template
    id: computer_state_age
    name: "Retro Monitor Computer State Age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    lambda: |-
      if (id(last_computer_state_ms) == 0) return 0.0f;
      return (millis() - id(last_computer_state_ms)) / 1000.0f;

  - platform: template
    id: display_frame_counter
    name: "Retro Monitor Frame Counter"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      return (float) id(display_frame_count);

  - platform: template
    id: last_page_switch_time
    name: "Retro Monitor Page Switch Time"
    unit_of_measurement: "ms"
    accuracy_decimals: 1
    update_interval: 5s
    entity_category: diagnostic
    lambda: |-
      return id(last_page_switch_ms);

  - platform: template
    id: last_render_time
    name: "Retro Monitor Render Time"
    unit_of_measurement: "ms"
    accuracy_decimals: 1
    update_interval: 5s
    entity_category: diagnostic
    lambda: |-
      return id(last_render_time_ms);

  - platform: template
    id: max_render_time
    name: "Retro Monitor Max Render Time"
    unit_of_measurement: "ms"
    accuracy_decimals: 1
    update_interval: 10s
    entity_category: diagnostic
    lambda: |-
      return id(max_render_time_ms);

  - platform: template
    id: wifi_last_event_age
    name: "Retro Monitor WiFi Event Age"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    lambda: |-
      if (retro_diag::last_wifi_event_ms == 0) return 0.0f;
      return (millis() - retro_diag::last_wifi_event_ms) / 1000.0f;

  - platform: template
    id: wifi_disconnect_counter
    name: "Retro Monitor WiFi Disconnect Count"
    accuracy_decimals: 0
    update_interval: 10s
    entity_category: diagnostic
    lambda: |-
      return (float) retro_diag::wifi_disconnect_count;

  - platform: template
    id: wifi_connect_counter
    name: "Retro Monitor WiFi Connect Count"
    accuracy_decimals: 0
    update_interval: 10s
    entity_category: diagnostic
    lambda: |-
      return (float) retro_diag::wifi_connect_count;

number:
  - platform: template
    id: display_brightness_control
    name: "Brightness"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 71
    set_action:
      - lambda: |-
          float pct = x;
          if (pct < 0.0f) pct = 0.0f;
          if (pct > 100.0f) pct = 100.0f;
          float raw = roundf((pct / 100.0f) * 255.0f);
          id(ctrl_brightness_raw) = raw;
          id(oled).set_brightness(raw / 255.0f);
          id(oled).update();

  - platform: template
    id: auto_rotate_interval_control
    name: "Auto Rotate Interval"
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 60
    step: 1
    unit_of_measurement: s
    initial_value: 10
    set_action:
      - lambda: |-
          id(ctrl_page_interval_s) = static_cast<uint32_t>(x < 1.0f ? 1.0f : x);

select:
  - platform: template
    id: current_page_control
    name: "Current Page"
    optimistic: true
    restore_value: true
    options:
      - "Auto Rotate"
      - "Router Panel"
      - "Computer Panel"
      - "Trend Panel"
    initial_option: "Auto Rotate"
    set_action:
      - lambda: |-
          if (x == "Auto Rotate") {
            id(ctrl_mode_code) = 0;
          } else if (x == "Router Panel") {
            id(ctrl_mode_code) = 1;
          } else if (x == "Computer Panel") {
            id(ctrl_mode_code) = 2;
          } else if (x == "Trend Panel") {
            id(ctrl_mode_code) = 3;
          } else {
            id(ctrl_mode_code) = 0;
          }
          id(last_page_rotate_ms) = millis();

binary_sensor:
  - platform: status
    id: esp_status
    name: "Retro Monitor Online"
    entity_category: diagnostic

  - platform: gpio
    id: boot_provision_button
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    internal: true
    on_multi_click:
      - timing:
          - ON for at least 3s
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(provision_overlay_mode) = 1;
              id(provision_success_until_ms) = 0;
              wifi::global_wifi_component->clear_sta();
              wifi::global_wifi_component->disable();
              id(oled).update();
          - delay: 200ms
          - lambda: |-
              wifi::global_wifi_component->enable();

switch:
  - platform: template
    id: display_power_control
    name: "Display Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(ctrl_display_power);
    turn_on_action:
      - lambda: |-
          id(ctrl_display_power) = true;
    turn_off_action:
      - lambda: |-
          id(ctrl_display_power) = false;

  - platform: template
    id: auto_rotate_control
    name: "Auto Rotate"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(ctrl_auto_rotate);
    turn_on_action:
      - lambda: |-
          id(ctrl_auto_rotate) = true;
          id(last_page_rotate_ms) = millis();
    turn_off_action:
      - lambda: |-
          id(ctrl_auto_rotate) = false;

# ---------------------------------------------------------------------------
# Intervals
# ---------------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - lambda: |-
          const float applied_brightness = id(ctrl_display_power) ? (id(ctrl_brightness_raw) / 255.0f) : 0.0f;
          id(oled).set_brightness(applied_brightness);

          if (id(provision_overlay_mode) == 2 && id(provision_success_until_ms) != 0 &&
              millis() > id(provision_success_until_ms)) {
            id(provision_overlay_mode) = 0;
            id(provision_success_until_ms) = 0;
          }

          const uint32_t now = millis();
          const bool computer_active =
            id(computer_payload_seen) &&
            ((now - id(last_computer_state_ms)) <= 10000UL);

          if (!computer_active) {
            id(rotate_page_index) = 0;
            id(last_page_rotate_ms) = now;
            if (id(current_page_code) != 1) {
              id(pending_page_code) = 1;
              id(page_switch_request_ms) = now;
            }
            id(oled).show_page(id(router_page));
            id(oled).update();
            return;
          }

          if (!id(ctrl_auto_rotate) || id(ctrl_mode_code) != 0) {
            switch (id(ctrl_mode_code)) {
              case 1:
                if (id(current_page_code) != 1) {
                  id(pending_page_code) = 1;
                  id(page_switch_request_ms) = now;
                }
                id(oled).show_page(id(router_page));
                break;
              case 3:
                if (id(current_page_code) != 3) {
                  id(pending_page_code) = 3;
                  id(page_switch_request_ms) = now;
                }
                id(oled).show_page(id(p2_trend_page));
                break;
              case 2:
              default:
                if (id(current_page_code) != 2) {
                  id(pending_page_code) = 2;
                  id(page_switch_request_ms) = now;
                }
                id(oled).show_page(id(mac_page));
                break;
            }
            id(last_page_rotate_ms) = now;
            id(oled).update();
            return;
          }

          const uint32_t rotate_every_ms = id(ctrl_page_interval_s) * 1000UL;
          if (id(last_page_rotate_ms) == 0 || (now - id(last_page_rotate_ms) >= rotate_every_ms)) {
            id(rotate_page_index) = (id(rotate_page_index) + 1) % 3;
            id(last_page_rotate_ms) = now;
          }

          switch (id(rotate_page_index)) {
            case 0:
              if (id(current_page_code) != 1) {
                id(pending_page_code) = 1;
                id(page_switch_request_ms) = now;
              }
              id(oled).show_page(id(router_page));
              break;
            case 1:
              if (id(current_page_code) != 2) {
                id(pending_page_code) = 2;
                id(page_switch_request_ms) = now;
              }
              id(oled).show_page(id(mac_page));
              break;
            default:
              if (id(current_page_code) != 3) {
                id(pending_page_code) = 3;
                id(page_switch_request_ms) = now;
              }
              id(oled).show_page(id(p2_trend_page));
              break;
          }
          id(oled).update();

  - interval: 1s
    then:
      - lambda: |-
          const size_t N = 24;
          auto sample_or_zero = [](float v) -> float {
            return std::isnan(v) ? 0.0f : v;
          };
          auto ensure_seeded = [&](std::vector<float> &vec, float value) {
            if (vec.size() != N) {
              vec.assign(N, value);
            }
          };
          auto current_lerp = [&](const std::vector<float> &from, const std::vector<float> &to, size_t i, float t) -> float {
            const float a = (i < from.size()) ? from[i] : 0.0f;
            const float b = (i < to.size()) ? to[i] : a;
            return a + (b - a) * t;
          };
          auto shift_append = [&](std::vector<float> &vec, float value) {
            if (vec.size() != N) {
              vec.assign(N, value);
              return;
            }
            for (size_t i = 0; i + 1 < N; i++) {
              vec[i] = vec[i + 1];
            }
            vec[N - 1] = value;
          };

          const float sys_value = sample_or_zero(id(mac_sys_power));
          const float cpu_value = sample_or_zero(id(mac_cpu_power));
          const float gpu_value = sample_or_zero(id(mac_gpu_load));

          ensure_seeded(id(trend_sys_prev), sys_value);
          ensure_seeded(id(trend_sys_target), sys_value);
          ensure_seeded(id(trend_cpu_prev), cpu_value);
          ensure_seeded(id(trend_cpu_target), cpu_value);
          ensure_seeded(id(trend_gpu_prev), gpu_value);
          ensure_seeded(id(trend_gpu_target), gpu_value);

          const uint32_t now = millis();
          const float duration = static_cast<float>(id(trend_anim_duration_ms));
          float t = 1.0f;
          if (id(trend_anim_start_ms) != 0 && duration > 0.0f) {
            t = std::min(1.0f, (now - id(trend_anim_start_ms)) / duration);
          }

          std::vector<float> sys_curr(N);
          std::vector<float> cpu_curr(N);
          std::vector<float> gpu_curr(N);
          for (size_t i = 0; i < N; i++) {
            sys_curr[i] = current_lerp(id(trend_sys_prev), id(trend_sys_target), i, t);
            cpu_curr[i] = current_lerp(id(trend_cpu_prev), id(trend_cpu_target), i, t);
            gpu_curr[i] = current_lerp(id(trend_gpu_prev), id(trend_gpu_target), i, t);
          }

          id(trend_sys_prev) = sys_curr;
          id(trend_cpu_prev) = cpu_curr;
          id(trend_gpu_prev) = gpu_curr;
          id(trend_sys_target) = sys_curr;
          id(trend_cpu_target) = cpu_curr;
          id(trend_gpu_target) = gpu_curr;

          shift_append(id(trend_sys_target), sys_value);
          shift_append(id(trend_cpu_target), cpu_value);
          shift_append(id(trend_gpu_target), gpu_value);
          id(trend_anim_start_ms) = now;

  - interval: 60s
    then:
      - lambda: |-
          const uint32_t last = id(last_ha_state_ms);
          if (last == 0) return;
          uint32_t stale_ms = millis() - last;
          if (stale_ms > 240000UL) {
            ESP_LOGW("watchdog", "HA stale >4min (%u ms), rebooting", stale_ms);
            id(restart_display).press();
          } else if (stale_ms > 180000UL) {
            ESP_LOGW("watchdog", "HA stale >3min (%u ms), forcing display update", stale_ms);
            id(oled).update();
          }

button:
  - platform: restart
    id: restart_display
    name: "${friendly_name} Restart"


font:
  - file: "fonts/unscii-8.ttf"
    id: font_header
    size: 6
  - file: "gfonts://IBM Plex Mono"
    id: font_section
    size: 9
  - file: "gfonts://IBM Plex Mono"
    id: font_trend_title
    size: 11
  - file: "fonts/MatrixSansScreen-Regular.ttf"
    id: font_big_num
    size: 26
    glyphs: "0123456789."
  - file: "fonts/MatrixSansScreen-Regular.ttf"
    id: font_net_big
    size: 18
    glyphs: "0123456789."
  - file: "gfonts://IBM Plex Mono"
    id: font_stat
    size: 8
  - file: "gfonts://IBM Plex Mono"
    id: font_micro
    size: 8

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
display:
  - platform: ssd1322_spi
    id: oled
    model: "SSD1322_256X64"
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO17
    update_interval: 1s
    pages:
      - id: mac_page
        lambda: |-
          const uint32_t render_start_us = micros();
          id(display_frame_count)++;
          auto finalize_page = [&](int page_code) {
            id(current_page_code) = page_code;
            if (id(pending_page_code) == page_code && id(page_switch_request_ms) != 0) {
              id(last_page_switch_ms) = millis() - id(page_switch_request_ms);
              id(pending_page_code) = 0;
              id(page_switch_request_ms) = 0;
            }
            const float render_ms = (micros() - render_start_us) / 1000.0f;
            id(last_render_time_ms) = render_ms;
            if (render_ms > id(max_render_time_ms)) id(max_render_time_ms) = render_ms;
          };

          auto safe_value = [](float v) -> float {
            return std::isnan(v) ? 0.0f : v;
          };
          auto draw_overlay = [&](const char *line1, const char *line2, const char *line3 = nullptr) {
            const int W = it.get_width();
            it.fill(COLOR_OFF);
            it.printf(W / 2, 18, id(font_section), COLOR_ON, TextAlign::TOP_CENTER, "%s", line1);
            it.printf(W / 2, 31, id(font_stat), COLOR_ON, TextAlign::TOP_CENTER, "%s", line2);
            if (line3 != nullptr) {
              it.printf(W / 2, 43, id(font_stat), COLOR_ON, TextAlign::TOP_CENTER, "%s", line3);
            }
          };

          if (id(provision_overlay_mode) == 1) {
            draw_overlay("SETUP MODE", "CONNECT AP", "192.168.4.1");
            finalize_page(2);
            return;
          }
          if (id(provision_overlay_mode) == 2) {
            draw_overlay("CONNECTED", "ENTERING UI");
            finalize_page(2);
            return;
          }

          const int W = it.get_width();
          const bool blink_on = (millis() / 500) % 2 == 0;
          it.fill(COLOR_OFF);
          it.printf(2, 0, id(font_header), COLOR_ON, "%s", "${host_label}");
          it.printf(W / 2, 0, id(font_header), COLOR_ON, TextAlign::TOP_CENTER, "MAC PANEL");
          it.printf(215, 0, id(font_header), COLOR_ON, id(mac_source_ok) ? "READY" : "ALERT");
          if (blink_on) {
            it.filled_rectangle(250, 1, 4, 4, COLOR_ON);
          } else {
            it.rectangle(250, 1, 4, 4, COLOR_ON);
          }
          it.line(0, 10, W, 10, COLOR_ON);
          it.line(85, 11, 85, 63, COLOR_ON);
          it.line(171, 11, 171, 63, COLOR_ON);

          if (!id(mac_source_ok)) {
            it.printf(84, 20, id(font_section), COLOR_ON, "SOURCE");
            it.printf(94, 34, id(font_section), COLOR_ON, "OFF");
            finalize_page(2);
            return;
          }

          const int left_x = 0;
          const int mid_x = 86;
          const int right_x = 172;
          const int left_right = 80;
          const int mid_right = 166;
          const int right_right = 252;

          auto draw_big_number = [&](int x, int y, float value) -> int {
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", value);
            int cursor = x;
            for (const char *p = buf; *p; ++p) {
              char glyph[2] = {*p, '\0'};
              it.printf(cursor, y, id(font_big_num), COLOR_ON, "%s", glyph);
              cursor += (*p == '.') ? 8 : 16;
            }
            return cursor - x;
          };

          auto draw_progress_blocks = [&](int right_edge, int y, float percent) {
            const int bw = 5, bh = 6, gap = 1, total = 12;
            float cl = percent < 0.0f ? 0.0f : (percent > 100.0f ? 100.0f : percent);
            int filled = static_cast<int>(roundf((cl / 100.0f) * total));
            int tw = total * bw + (total - 1) * gap;
            int x = right_edge - tw;
            Color bright_color(0, 0, 0, 178);  // 70% brightness
            Color dim_color(0, 0, 0, 77);      // 30% brightness
            for (int i = 0; i < total; i++) {
              if (i < filled) {
                it.filled_rectangle(x, y, bw, bh, bright_color);
              } else {
                it.filled_rectangle(x, y, bw, bh, dim_color);
              }
              x += bw + gap;
            }
          };

          const float cpu_temp_v = safe_value(id(mac_cpu_temp));
          const float cpu_load_v = safe_value(id(mac_cpu_load));
          const float cpu_power_v = safe_value(id(mac_cpu_power));

          it.printf(left_x + 4, 16, id(font_section), COLOR_ON, "CPU");
          const int cpu_dw = draw_big_number(left_x + 4, 25, cpu_temp_v);
          it.printf(left_x + 6 + cpu_dw, 24, id(font_stat), COLOR_ON, "C");
          it.printf(left_right, 31, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "LD %02.0f", cpu_load_v);
          it.printf(left_right, 40, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "PW %03.0f", cpu_power_v);
          draw_progress_blocks(left_right, 55, cpu_load_v);

          const float mem_pct = safe_value(id(mac_mem_pct));
          const float mem_used = safe_value(id(mac_mem_used)) / 1024.0f;
          const float disk_tmp = safe_value(id(mac_disk_temp));

          it.printf(mid_x + 4, 16, id(font_section), COLOR_ON, "MEM");
          const int mem_dw = draw_big_number(mid_x + 4, 25, mem_pct);
          it.printf(mid_x + 6 + mem_dw, 24, id(font_stat), COLOR_ON, "%%");
          it.printf(mid_right, 31, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "USE %.0fG", mem_used);
          it.printf(mid_right, 40, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "DSK %02.0f", disk_tmp);
          draw_progress_blocks(mid_right, 55, mem_pct);

          const float gpu_temp_v = safe_value(id(mac_gpu_temp));
          const float gpu_load_v = safe_value(id(mac_gpu_load));
          const float sys_pwr = safe_value(id(mac_sys_power));

          it.printf(right_x + 4, 16, id(font_section), COLOR_ON, "GPU");
          const int gpu_dw = draw_big_number(right_x + 4, 25, gpu_temp_v);
          it.printf(right_x + 6 + gpu_dw, 24, id(font_stat), COLOR_ON, "C");
          it.printf(right_right, 31, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "LD %02.0f", gpu_load_v);
          it.printf(right_right, 40, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "SY %03.0f", sys_pwr);
          draw_progress_blocks(right_right, 55, gpu_load_v);
          finalize_page(2);

      - id: router_page
        lambda: |-
          const uint32_t render_start_us = micros();
          id(display_frame_count)++;
          auto finalize_page = [&](int page_code) {
            id(current_page_code) = page_code;
            if (id(pending_page_code) == page_code && id(page_switch_request_ms) != 0) {
              id(last_page_switch_ms) = millis() - id(page_switch_request_ms);
              id(pending_page_code) = 0;
              id(page_switch_request_ms) = 0;
            }
            const float render_ms = (micros() - render_start_us) / 1000.0f;
            id(last_render_time_ms) = render_ms;
            if (render_ms > id(max_render_time_ms)) id(max_render_time_ms) = render_ms;
          };

          auto safe_value = [](float v) -> float {
            return std::isnan(v) ? 0.0f : v;
          };
          auto draw_overlay = [&](const char *line1, const char *line2, const char *line3 = nullptr) {
            const int W = it.get_width();
            it.fill(COLOR_OFF);
            it.printf(W / 2, 18, id(font_section), COLOR_ON, TextAlign::TOP_CENTER, "%s", line1);
