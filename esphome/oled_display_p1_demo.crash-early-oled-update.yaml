          it.printf(mid_right, 31, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "LD %02.0f", rcpu_l);
          it.printf(mid_right, 40, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "UP %03.0fh", wan_h);
          draw_progress_blocks(mid_right, 55, rcpu_l);

          const float rmem_p = safe_value(id(rtr_mem_pct));
          const float rmem_u = safe_value(id(rtr_mem_used)) / 1024.0f;
          const float rmem_t = safe_value(id(rtr_mem_tot)) / 1024.0f;

          it.printf(right_x + 4, 16, id(font_section), COLOR_ON, "MEM");
          const int rmd = draw_big_number(right_x + 4, 25, rmem_p);
          it.printf(right_x + 6 + rmd, 24, id(font_stat), COLOR_ON, "%%");
          it.printf(right_right, 31, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "USE %.0fG", rmem_u);
          it.printf(right_right, 40, id(font_stat), COLOR_ON, TextAlign::TOP_RIGHT, "TOT %.0fG", rmem_t);
          draw_progress_blocks(right_right, 55, rmem_p);
          finalize_page(1);

      - id: p2_trend_page
        lambda: |-
          const uint32_t render_start_us = micros();
          id(display_frame_count)++;
          auto finalize_page = [&](int page_code) {
            id(current_page_code) = page_code;
            if (id(pending_page_code) == page_code && id(page_switch_request_ms) != 0) {
              id(last_page_switch_ms) = millis() - id(page_switch_request_ms);
              id(pending_page_code) = 0;
              id(page_switch_request_ms) = 0;
            }
            const float render_ms = (micros() - render_start_us) / 1000.0f;
            id(last_render_time_ms) = render_ms;
            if (render_ms > id(max_render_time_ms)) id(max_render_time_ms) = render_ms;
          };

          auto safe_value = [](float v) -> float {
            return std::isnan(v) ? 0.0f : v;
          };
          auto draw_overlay = [&](const char *line1, const char *line2, const char *line3 = nullptr) {
            const int W = it.get_width();
            it.fill(COLOR_OFF);
            it.printf(W / 2, 18, id(font_section), COLOR_ON, TextAlign::TOP_CENTER, "%s", line1);
            it.printf(W / 2, 31, id(font_stat), COLOR_ON, TextAlign::TOP_CENTER, "%s", line2);
            if (line3 != nullptr) {
              it.printf(W / 2, 43, id(font_stat), COLOR_ON, TextAlign::TOP_CENTER, "%s", line3);
            }
          };

          if (id(provision_overlay_mode) == 1) {
            draw_overlay("SETUP MODE", "CONNECT AP", "192.168.4.1");
            finalize_page(3);
            return;
          }
          if (id(provision_overlay_mode) == 2) {
            draw_overlay("CONNECTED", "ENTERING UI");
            finalize_page(3);
            return;
          }
          auto clamp01 = [](float v) -> float {
            if (v < 0.0f) return 0.0f;
            if (v > 1.0f) return 1.0f;
            return v;
          };
          auto lerp_at = [&](const std::vector<float> &from, const std::vector<float> &to, size_t i, float t) -> float {
            const float a = (i < from.size()) ? from[i] : 0.0f;
            const float b = (i < to.size()) ? to[i] : a;
            return a + (b - a) * t;
          };
          auto draw_trend = [&](const std::vector<float> &from, const std::vector<float> &to, int x, int y, int w, int h, Color color, float t) {
            const size_t count = std::min(from.size(), to.size());
            if (count < 2) return;

            std::vector<float> values(count);
            float min_v = 1000000.0f;
            float max_v = -1000000.0f;
            for (size_t i = 0; i < count; i++) {
              values[i] = lerp_at(from, to, i, t);
              min_v = std::min(min_v, values[i]);
              max_v = std::max(max_v, values[i]);
            }
            const float span = std::max(1.0f, max_v - min_v);
            const float step = static_cast<float>(w) / static_cast<float>(count - 1);

            for (size_t i = 0; i + 1 < count; i++) {
              const int x1 = x + static_cast<int>(roundf(step * i));
              const int x2 = x + static_cast<int>(roundf(step * (i + 1)));
              const float n1 = (values[i] - min_v) / span;
              const float n2 = (values[i + 1] - min_v) / span;
              const int y1 = y + h - static_cast<int>(roundf(n1 * h));
              const int y2 = y + h - static_cast<int>(roundf(n2 * h));
              it.line(x1, y1, x2, y2, color);
            }
          };

          const int W = it.get_width();
          const uint32_t blink_phase_ms = millis() % 1000UL;
          const float blink_t = blink_phase_ms <= 500UL
            ? (blink_phase_ms / 500.0f)
            : ((1000UL - blink_phase_ms) / 500.0f);
          const uint8_t blink_alpha = static_cast<uint8_t>(51.0f + (204.0f * blink_t));
          const Color trend_blink_color(0, 0, 0, blink_alpha);
          const bool blink_on = blink_alpha > 140;
          it.fill(COLOR_OFF);
          it.printf(2, 0, id(font_header), COLOR_ON, "%s", "${host_label}");
          it.printf(W / 2, 0, id(font_header), COLOR_ON, TextAlign::TOP_CENTER, "P2 TREND");
          it.printf(215, 0, id(font_header), COLOR_ON, id(mac_source_ok) ? "LIVE" : "ALERT");
          if (blink_on) {
            it.filled_rectangle(250, 1, 4, 4, COLOR_ON);
          } else {
            it.rectangle(250, 1, 4, 4, COLOR_ON);
          }
          it.line(0, 10, W, 10, COLOR_ON);

          if (!id(mac_source_ok)) {
            it.printf(92, 20, id(font_section), COLOR_ON, "TREND");
            it.printf(104, 34, id(font_section), COLOR_ON, "OFF");
            finalize_page(3);
            return;
          }

          const uint32_t now = millis();
          const float duration = static_cast<float>(id(trend_anim_duration_ms));
          float t = 1.0f;
          if (id(trend_anim_start_ms) != 0 && duration > 0.0f) {
            t = clamp01((now - id(trend_anim_start_ms)) / duration);
          }

          const int divider_x = 86;
          const int left_x = 6;
          const int chart_x = 92;
          const int chart_y = 16;
          const int chart_w = 156;
          const int chart_h = 47;
          const int trace_w = 136;
          const int blink_x = chart_x + trace_w;
          const int blink_w = chart_w - trace_w;

          it.line(divider_x, 12, divider_x, 63, Color(0, 0, 0, 56));
          it.printf(left_x, 16, id(font_trend_title), COLOR_ON, "POWER TREND");

          it.printf(left_x, 34, id(font_stat), Color(0, 0, 0, 255), "SYSTEM %03.0fW", safe_value(id(mac_sys_power)));
          it.printf(left_x, 44, id(font_stat), Color(0, 0, 0, 77),  "CPU %03.0fW", safe_value(id(mac_cpu_power)));
          it.printf(left_x, 54, id(font_stat), Color(0, 0, 0, 51),  "GPU %02.0f%%", safe_value(id(mac_gpu_load)));

          it.rectangle(chart_x, chart_y, chart_w, chart_h, Color(0, 0, 0, 56));
          for (int gy = chart_y + 6; gy < chart_y + chart_h; gy += 6) {
            it.line(chart_x + 1, gy, chart_x + chart_w - 2, gy, Color(0, 0, 0, 20));
          }
          for (int gx = chart_x + 12; gx < chart_x + chart_w; gx += 12) {
            it.line(gx, chart_y + 1, gx, chart_y + chart_h - 2, Color(0, 0, 0, 20));
          }

          draw_trend(id(trend_sys_prev), id(trend_sys_target), chart_x + 2, chart_y + 2, trace_w - 4, chart_h - 4, Color(0, 0, 0, 255), t);
          draw_trend(id(trend_cpu_prev), id(trend_cpu_target), chart_x + 2, chart_y + 2, trace_w - 4, chart_h - 4, Color(0, 0, 0, 77), t);
          draw_trend(id(trend_gpu_prev), id(trend_gpu_target), chart_x + 2, chart_y + 2, trace_w - 4, chart_h - 4, Color(0, 0, 0, 51), t);

          it.line(blink_x, chart_y + 1, blink_x, chart_y + chart_h - 2, Color(0, 0, 0, 28));
          it.filled_rectangle(blink_x + (blink_w / 2) - 3, chart_y + 1, 6, chart_h - 2, trend_blink_color);
          finalize_page(3);
