substitutions:
  devicename: retro-vfd-smoke
  friendly_name: Retro VFD Smoke Test

  # ESP32-C3 SuperMini exposed pins. Avoid GPIO8/9 boot-related pins and USB/JTAG pins.
  vfd_pin_rst: "0"
  vfd_pin_cs: "1"
  vfd_pin_cp: "4"
  vfd_pin_da: "5"
  vfd_pin_en: "6"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  includes:
    - includes/vfd_016st106ink/vfd_016st106ink.h
  platformio_options:
    build_flags:
      - -D VFD_PIN_RST=${vfd_pin_rst}
      - -D VFD_PIN_CS=${vfd_pin_cs}
      - -D VFD_PIN_CP=${vfd_pin_cp}
      - -D VFD_PIN_DA=${vfd_pin_da}
      - -D VFD_PIN_EN=${vfd_pin_en}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          vfd_016st106ink::begin(0xFF);
          vfd_016st106ink::print_line(1, "NOX VFD");
          vfd_016st106ink::print_line(2, "ESP32C3 READY");
          for (uint8_t i = 0; i < 7; i++) {
            vfd_016st106ink::set_icon_native(i, true, true);
            delay(45);
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Retro VFD Fallback"
    password: "retro-vfd"

captive_portal:

globals:
  - id: vfd_page
    type: uint8_t
    restore_value: no
    initial_value: "0"

interval:
  - interval: 2s
    then:
      - lambda: |-
          id(vfd_page) = (id(vfd_page) + 1) % 4;
          switch (id(vfd_page)) {
            case 0:
              vfd_016st106ink::print_line(1, "NOX VFD");
              vfd_016st106ink::print_line(2, "ESP32C3 READY");
              break;
            case 1:
              vfd_016st106ink::print_line(1, "CPU 062C");
              vfd_016st106ink::print_line(2, "LOAD047 P086W");
              break;
            case 2:
              vfd_016st106ink::print_line(1, "GPU 054C");
              vfd_016st106ink::print_line(2, "LOAD021 P142W");
              break;
            default:
              vfd_016st106ink::print_line(1, "PWR 286W");
              vfd_016st106ink::print_line(2, "DSK041 FAN1820");
              break;
          }

button:
  - platform: restart
    name: "Restart"
