[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-monitor"
version = "0.1.0"
description = "Telemetry agent and Home Assistant scaffold for an ESP32 SSD1322 retro monitor."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Codex" }
]
dependencies = ["psutil>=7.2,<8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
retro-monitor-agent = "retro_monitor_agent.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
