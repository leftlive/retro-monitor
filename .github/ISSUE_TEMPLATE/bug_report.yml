name: Bug report
description: Report a reproducible problem with Retro Monitor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove private hostnames, IPs, Wi-Fi details, tokens, and serial numbers before posting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - macOS Go agent
        - Windows agent
        - Home Assistant integration
        - ESPHome OLED
        - OpenWrt router telemetry
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, board model, screen model, Home Assistant version, ESPHome version, or .NET version as relevant.
